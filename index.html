<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>英文逐句跟讀教室</title><style>body{font-family:Arial,'Microsoft JhengHei',sans-serif;background:#f4f9f8;color:#213b3b;margin:0}main{max-width:800px;margin:auto;padding:20px}header{background:#dcefe9;border-radius:20px;padding:22px}h1{margin:0 0 5px}section{background:white;border-radius:16px;padding:20px;margin-top:15px;box-shadow:0 2px 12px #1b474311}button,select{font:inherit;padding:10px;border-radius:9px;border:1px solid #bfd7d0}button{background:#277a72;color:white;cursor:pointer;margin:3px}button:disabled{opacity:.5}select{max-width:100%}.english{font-size:clamp(22px,4vw,30px);line-height:1.65;font-weight:bold}.break{color:#118b87;font-weight:bold;padding:0 5px}.translation{color:#58716e}.status{color:#277a72;font-weight:bold}.line{border-bottom:1px solid #e4eeeb;padding:12px 0;cursor:pointer}.line.active{background:#eef8f5}.hint{color:#607875;font-size:13px}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:12px}label{display:flex;gap:5px;align-items:center}</style><main><header><h1>英文逐句跟讀教室</h1><div>選課次・聽整句・看斷句・跟著念</div></header><section><label>選擇課次 <select id="lesson"></select></label><p class="hint" id="count"></p><div class="english" id="english"></div><p class="translation" id="translation"></p><p class="status" id="status">請按播放開始。</p><div class="row"><button id="start">▶ 自動逐句跟讀</button><button id="play">播放本句</button><button id="stop">停止</button><button id="prev">上一句</button><button id="next">下一句</button></div><div class="row"><label>跟讀停頓 <select id="gap"><option value="3">3 秒</option><option value="5" selected>5 秒</option><option value="8">8 秒</option></select></label><label>語速 <select id="rate"><option value="0.5">0.50 倍（特別慢）</option><option value="0.65">0.65 倍（很慢）</option><option value="0.7" selected>0.70 倍（建議）</option><option value="0.75">0.75 倍</option><option value="0.8">0.80 倍</option><option value="0.9">0.90 倍</option><option value="1">1.00 倍（正常）</option></select></label><label>英文聲音 <select id="voice"></select></label><label><input type="checkbox" id="zh" checked>顯示中文</label></div><p class="hint">／ 為視覺斷句提示。朗讀時整句自然播放，不強制在斜線處切斷語音。語音種類依手機或電腦而異。</p></section><section><b>課文句子（點選即可播放）</b><div id="list"></div></section><p class="hint">老師如需更新課文，請使用 teacher.html 編輯並下載 lessons.json，再上傳覆蓋網站同名檔案。</p></main><script>
let lessons=[],lessonIndex=0,index=0,autoplay=false,timer=null,token=0;
const $=id=>document.getElementById(id);
function current(){return lessons[lessonIndex]?.sentences||[]}
function stop(){autoplay=false;token++;clearTimeout(timer);speechSynthesis.cancel()}
function show(){const a=current(),row=a[index];$('count').textContent=`第 ${index+1}／${a.length} 句`; $('english').replaceChildren();if(row){row[0].split(/\s*\/\s*/).forEach((part,i)=>{if(i){let sp=document.createElement('span');sp.className='break';sp.textContent='／';$('english').append(sp)}$('english').append(document.createTextNode(part))});$('translation').textContent=row[1]||''}$('translation').hidden=!$('zh').checked;$('prev').disabled=index===0;$('next').disabled=index>=a.length-1;const list=$('list');list.replaceChildren();a.forEach((r,i)=>{let div=document.createElement('div');div.className='line'+(i===index?' active':'');div.textContent=(i+1)+'. '+r[0].replace(/\s*\/\s*/g,' ／ ');div.onclick=()=>{stop();index=i;show();speak(false)};list.append(div)})}
function speak(auto){if(!current().length)return;token++;clearTimeout(timer);speechSynthesis.cancel();let mine=token;const u=new SpeechSynthesisUtterance(current()[index][0].replace(/\s*\/\s*/g,' '));u.lang='en-US';u.rate=Number($('rate').value);const voice=speechSynthesis.getVoices().find(v=>v.voiceURI===$('voice').value);if(voice)u.voice=voice;u.onstart=()=>{if(mine===token)$('status').textContent='正在自然朗讀整句…'};u.onend=()=>{if(mine!==token)return;if(auto&&autoplay){$('status').textContent='換你跟讀！';timer=setTimeout(()=>{if(mine!==token)return;if(index<current().length-1){index++;show();speak(true)}else{autoplay=false;$('status').textContent='這一課練習完成！'}},Number($('gap').value)*1000)}else $('status').textContent='本句朗讀完成。'};u.onerror=()=>{if(mine===token)$('status').textContent='語音無法播放，請試試其他英文聲音或瀏覽器。'};speechSynthesis.speak(u)}
function voices(){let v=speechSynthesis.getVoices().filter(x=>x.lang.startsWith('en')),old=$('voice').value;$('voice').replaceChildren();v.forEach(x=>{let o=document.createElement('option');o.value=x.voiceURI;o.textContent=x.name+' ('+x.lang+')';$('voice').append(o)});let preferred=v.find(x=>x.lang==='en-US'&&/Jenny|Aria|Samantha|Zira|Ava|Victoria|Karen|female/i.test(x.name))||v.find(x=>x.lang==='en-US')||v[0];$('voice').value=v.some(x=>x.voiceURI===old)?old:preferred?.voiceURI||''}
speechSynthesis.onvoiceschanged=voices;voices();
$('start').onclick=()=>{stop();autoplay=true;speak(true)};$('play').onclick=()=>{stop();speak(false)};$('stop').onclick=()=>{stop();$('status').textContent='已停止。'};$('prev').onclick=()=>{stop();index=Math.max(0,index-1);show()};$('next').onclick=()=>{stop();index=Math.min(current().length-1,index+1);show()};$('zh').onchange=show;$('lesson').onchange=()=>{stop();lessonIndex=Number($('lesson').value);index=0;show()};
fetch('./lessons.json',{cache:'no-store'}).then(r=>{if(!r.ok)throw Error();return r.json()}).then(d=>{lessons=d;lessons.forEach((l,i)=>{let o=document.createElement('option');o.value=i;o.textContent=l.title;$('lesson').append(o)});show()}).catch(()=>$('status').textContent='無法載入課文：請從已發布的網站網址開啟，不要直接開啟 index.html。');
</script></html>
