<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>老師課文編輯器</title><style>body{font-family:Arial,'Microsoft JhengHei',sans-serif;background:#f4f9f8;color:#234;margin:0}main{max-width:800px;margin:auto;padding:22px}section{background:white;border-radius:16px;padding:18px;margin:15px 0}button,input,select,textarea{font:inherit;padding:10px;border:1px solid #a9c8c2;border-radius:8px}button{background:#287e73;color:white;cursor:pointer;margin:4px}textarea{width:100%;box-sizing:border-box;min-height:250px;line-height:1.8}input{max-width:95%}label{display:block;margin:12px 0}.hint{color:#596e69;font-size:14px}</style><main><h1>老師專用｜課文編輯器</h1><p>這個編輯器可在電腦上開啟。修改完成後，下載 lessons.json 並上傳到網站，學生才能看到更新。</p><section><label>匯入既有課文資料 <input type="file" id="file" accept=".json,application/json"></label><p class="hint">第一次使用請匯入壓縮包中的 lessons.json，避免覆蓋原有課次。</p><label>選擇課次 <select id="lesson"></select></label><button id="new">＋新增課次</button><button id="delete">刪除目前課次</button><label>課次名稱 <input id="title" placeholder="Lesson 2｜My Family" style="width:90%"></label><label>課文（每行一句；英文 | 中文；用 / 表示畫面斷句）<textarea id="sentences" placeholder="I get up / at seven. | 我七點起床。"></textarea></label><button id="save">儲存目前課次到編輯器</button><button id="export">下載 lessons.json（更新學生網站用）</button><p id="status" class="hint"></p></section><section><b>發布提醒</b><p>下載的新 lessons.json 必須覆蓋 GitHub 儲存庫中的同名檔案，才會同步到學生固定網址。請勿把老師編輯器放在公開網站，以免混淆；若要保護編輯權限，請妥善保管 GitHub 帳號。</p></section></main><script>
let lessons=[],idx=0;const $=id=>document.getElementById(id);const msg=s=>$('status').textContent=s;
function menu(){let sel=$('lesson');sel.replaceChildren();lessons.forEach((l,i)=>{let o=document.createElement('option');o.value=i;o.textContent=l.title;sel.append(o)});idx=Math.min(idx,lessons.length-1);sel.value=idx;load()}
function load(){let l=lessons[idx];$('title').value=l?.title||'';$('sentences').value=(l?.sentences||[]).map(r=>r[0]+' | '+(r[1]||'')).join('\n')}
function save(){if(!lessons[idx])return false;let title=$('title').value.trim();if(!title){msg('請填寫課次名稱');return false}let rows=$('sentences').value.split(/\r?\n/).map(line=>{let p=line.split('|');return [p.shift().trim(),p.join('|').trim()]}).filter(r=>r[0]);if(!rows.length){msg('至少需要一句英文');return false}lessons[idx].title=title;lessons[idx].sentences=rows;menu();msg('已暫存在編輯器，請下載 JSON 才能保留與發布。');return true}
$('file').onchange=async e=>{try{let d=JSON.parse(await e.target.files[0].text());if(!Array.isArray(d)||!d.every(l=>typeof l.title==='string'&&Array.isArray(l.sentences)))throw Error();lessons=d;idx=0;menu();msg('匯入成功，共 '+d.length+' 課')}catch{msg('檔案格式不正確，請匯入 lessons.json')}};
$('lesson').onchange=()=>{idx=Number($('lesson').value);load()};$('save').onclick=save;$('new').onclick=()=>{lessons.push({id:'lesson-'+Date.now(),title:'Lesson '+(lessons.length+1),sentences:[]});idx=lessons.length-1;menu();msg('已新增課次，請輸入課文後儲存。')};$('delete').onclick=()=>{if(lessons.length<2){msg('至少保留一課');return}if(confirm('確定刪除這一課？')){lessons.splice(idx,1);idx=0;menu()}};$('export').onclick=()=>{if(!save())return;let blob=new Blob([JSON.stringify(lessons,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='lessons.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);msg('已下載 lessons.json。請上傳覆蓋網站同名檔案。')};
lessons=[{id:'lesson-1',title:'Lesson 1｜示範課文',sentences:[]}];menu();
</script></html>
